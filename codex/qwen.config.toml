# Codex profile for the local Qwen3.8-27B model served by llama.cpp.
# Installed to ~/.codex/qwen.config.toml by setup.sh. Select it with: codex --profile qwen
model = "qwen3.8-27b"
model_provider = "llamacpp"
model_context_window = 32768
model_max_output_tokens = 4096
model_reasoning_effort = "low"

# Sandbox defaults. Override per run with -s / -a, see README.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false
